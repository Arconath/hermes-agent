name: Arconath Hermes contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'arconath/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: arconath-jit
      labels: [self-hosted, linux, x64, arconath-jit, rootless-buildkit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify isolated private runner
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -z "${DOCKER_HOST:-}" ]]
          [[ -z "${CONTAINER_HOST:-}" ]]
          [[ ! -S /var/run/docker.sock ]]
          [[ ! -S "/run/user/$(id -u)/docker.sock" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
      - name: Install locked test dependencies
        run: uv sync --locked --extra dev --extra messaging
      - name: Lint maintained patch
        run: uv run --locked --extra dev --extra messaging ruff check gateway/platforms/api_server.py tests/gateway/test_api_server_runs.py
      - name: Verify AgentDeck compatibility contracts
        run: uv run --locked --extra dev --extra messaging pytest -q tests/gateway/test_api_server_runs.py
      - name: Verify no active hosted-runner workflow remains
        run: python3 scripts/verify-arconath-workflows.py
